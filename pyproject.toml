[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbon-aware-dispatcher"
version = "1.9.3"
description = "Run CI/CD only when the energy grid is clean. Free, zero-config carbon-aware scheduling for US, UK and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Peter Klingelhofer", email = "peterklingelhofer@gmail.com" },
]
keywords = [
    "carbon",
    "ci-cd",
    "sustainability",
    "github-actions",
    "green-energy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
# Only dev tooling is declared. The adapters in integrations/ import their
# framework lazily and run against the Airflow, Ray, Dagster, Prefect, Lightning
# or Transformers install the user already has, and declaring those as extras
# would pull their heavy dependency trees into uv.lock
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
    "pre-commit",
]

[project.scripts]
carbon-dispatch = "check_grid:main"
carbon-dispatch-setup = "setup_wizard:main"
carbon-aware = "cli:main"

[project.urls]
Homepage = "https://github.com/peterklingelhofer/carbon-aware-dispatcher"
Repository = "https://github.com/peterklingelhofer/carbon-aware-dispatcher"

[tool.hatch.build.targets.wheel]
only-include = [
    "check_grid.py",
    "cli.py",
    "setup_wizard.py",
    "ledger.py",
    "notify.py",
    "digest.py",
    "pr_comment.py",
    "carbon_curve.py",
    "suggest_pr.py",
    "marginal.py",
    "forecast_log.py",
    "citations_generated.py",
    "data/emission-factors.json",
    "providers",
    "integrations",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM", "C4", "RET", "PIE", "PERF", "RUF"]

[tool.mypy]
files = ["*.py", "providers", "integrations", "scripts"]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.coverage.run]
source = ["check_grid", "providers", "setup_wizard"]

[tool.coverage.report]
show_missing = true
