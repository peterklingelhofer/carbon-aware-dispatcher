name: Carbon-Aware Check (Demo)

# Manual demo: click "Run workflow" in the Actions tab to check live grid
# carbon intensity and render a job summary table. Uses free, no-key providers
# so it works with zero secrets configured.
#
# Two ways to choose zones in the run window:
#   - preset: pick auto:cleanest (all free zones, lowest wins), auto:green (small
#     curated list), or the GB,AU-NSW example.
#   - custom_zones: type any comma-separated zones (e.g. CISO,GB,FR); when set it
#     overrides the preset. This is how you check arbitrary combinations.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset (ignored if 'custom zones' is filled). auto:cleanest = check every free-provider zone worldwide, pick the single lowest (most thorough, most API calls). auto:green = small curated list of usually-clean zones (fewer calls). GB,AU-NSW = fixed keyless example."
        required: false
        type: choice
        default: "auto:cleanest"
        options:
          - "auto:cleanest"
          - "auto:green"
          - "GB,AU-NSW"
      custom_zones:
        description: "Custom zones, comma-separated (e.g. CISO,GB,FR,BR-NE). Overrides the preset when set. See the README for zone codes. EU/global zones may need a token secret."
        required: false
        type: string
        default: ""
      max_carbon:
        description: "Max carbon intensity threshold (gCO2eq/kWh)"
        required: false
        type: string
        default: "250"

jobs:
  carbon-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run carbon-aware check
        id: check
        uses: ./
        with:
          # custom_zones overrides the preset when the user fills it in
          grid_zones: ${{ inputs.custom_zones != '' && inputs.custom_zones || inputs.preset }}
          max_carbon_intensity: ${{ inputs.max_carbon }}
          electricity_maps_token: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
          entsoe_token: ${{ secrets.ENTSOE_TOKEN }}
          eia_api_key: ${{ secrets.EIA_API_KEY }}
          gridstatus_api_key: ${{ secrets.GRID_STATUS_API_KEY }}

      - name: Show results
        run: |
          echo "Grid clean: ${{ steps.check.outputs.grid_clean }}"
          echo "Selected zone: ${{ steps.check.outputs.grid_zone }}"
          echo "Carbon intensity: ${{ steps.check.outputs.carbon_intensity }} gCO2eq/kWh"
          echo "CO2 saved: ${{ steps.check.outputs.co2_saved_grams }} g"
