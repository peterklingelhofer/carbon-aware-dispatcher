name: Carbon-Aware Check (Demo)

# Manual demo: click "Run workflow" in the Actions tab to check live grid
# carbon intensity and render a job summary table. Uses free, no-key providers
# so it works with zero secrets configured.
#
# Preset choices:
#   auto:cleanest - checks every free-provider zone worldwide, picks the single
#                   lowest. Most thorough; makes the most API calls.
#   auto:green    - a small curated list of usually-clean zones. Fewer calls.
#   GB,AU-NSW     - a fixed example pair (UK + Australia), keyless and fast.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Which zones to check"
        required: false
        type: choice
        default: "auto:cleanest"
        options:
          - "auto:cleanest"   # check every free-provider zone, pick the single lowest worldwide
          - "auto:green"      # a small curated list of usually-clean zones (fewer API calls)
          - "GB,AU-NSW"       # a fixed example pair (UK + Australia), keyless and fast
      max_carbon:
        description: "Max carbon intensity threshold (gCO2eq/kWh)"
        required: false
        type: string
        default: "250"

jobs:
  carbon-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run carbon-aware check
        id: check
        uses: ./
        with:
          grid_zones: ${{ inputs.preset }}
          max_carbon_intensity: ${{ inputs.max_carbon }}
          electricity_maps_token: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
          entsoe_token: ${{ secrets.ENTSOE_TOKEN }}
          eia_api_key: ${{ secrets.EIA_API_KEY }}
          gridstatus_api_key: ${{ secrets.GRID_STATUS_API_KEY }}

      - name: Show results
        run: |
          echo "Grid clean: ${{ steps.check.outputs.grid_clean }}"
          echo "Selected zone: ${{ steps.check.outputs.grid_zone }}"
          echo "Carbon intensity: ${{ steps.check.outputs.carbon_intensity }} gCO2eq/kWh"
          echo "CO2 saved: ${{ steps.check.outputs.co2_saved_grams }} g"
