name: Carbon-Aware Check (Demo)

# Manual demo: click "Run workflow" in the Actions tab to check live grid
# carbon intensity across several zones and render a job summary table.
# Uses only free, no-key providers by default (UK, US EIA, AEMO, Open-Meteo)
# so it works with zero secrets configured.

on:
  workflow_dispatch:
    inputs:
      grid_zones:
        description: "Comma-separated zones (or auto:green, auto:cleanest)"
        required: false
        type: string
        # Default to the unlimited free providers (UK + Australia) so the demo
        # gives a clean result with no API key. Add CISO/FR with an EIA key or
        # entsoe_token secret for US and European coverage.
        default: "GB,AU-NSW"
      max_carbon:
        description: "Max carbon intensity threshold (gCO2eq/kWh)"
        required: false
        type: string
        default: "250"

jobs:
  carbon-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run carbon-aware check
        id: check
        uses: ./
        with:
          grid_zones: ${{ inputs.grid_zones }}
          max_carbon_intensity: ${{ inputs.max_carbon }}
          electricity_maps_token: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}
          entsoe_token: ${{ secrets.ENTSOE_TOKEN }}
          eia_api_key: ${{ secrets.EIA_API_KEY }}
          gridstatus_api_key: ${{ secrets.GRID_STATUS_API_KEY }}

      - name: Show results
        run: |
          echo "Grid clean: ${{ steps.check.outputs.grid_clean }}"
          echo "Selected zone: ${{ steps.check.outputs.grid_zone }}"
          echo "Carbon intensity: ${{ steps.check.outputs.carbon_intensity }} gCO2eq/kWh"
          echo "CO2 saved: ${{ steps.check.outputs.co2_saved_grams }} g"
