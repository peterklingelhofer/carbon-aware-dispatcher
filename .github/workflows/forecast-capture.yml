# Lead-time-stamped GB forecast capture
#
# docs/VALIDATION.md section 2 can only score the published GB forecast
# lead-time-agnostically, because the upstream archive keeps one forecast per
# settlement period without recording when it was issued. That gap cannot be
# closed retrospectively, only by collecting forward. This appends the current
# 48h-ahead forecast to data/validation/gb-fw48h-log.csv four times a day, which
# is enough to cover every lead time from 0 to 48 hours without committing hourly.

name: GB forecast capture

on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Capture forecast
        run: uv run --with requests python scripts/capture_gb_forecast.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/validation/gb-fw48h-log.csv; then
            echo "no new rows"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/gb-fw48h-log.csv
          git commit -m "data: gb forecast capture"
          git push
