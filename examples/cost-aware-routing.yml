# Cost + Carbon Routing
#
# Among multiple candidate zones, pick one that is both clean AND cheap. The
# action blends each zone's carbon intensity with a representative cloud price
# (via the public Azure Retail Prices API, no key) and selects the best by a
# weight you set:
#   cost_weight: 0   -> cleanest zone only (default)
#   cost_weight: 1   -> cheapest zone only
#   cost_weight: 0.5 -> balance cost and carbon
#
# Copy to .github/workflows/cost-aware-routing.yml

name: Cost-Aware Carbon Routing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      zone: ${{ steps.carbon.outputs.grid_zone }}
      region: ${{ steps.carbon.outputs.azure_region }}
      intensity: ${{ steps.carbon.outputs.carbon_intensity }}
      price: ${{ steps.carbon.outputs.selected_cost_usd_hr }}
    steps:
      - uses: peterklingelhofer/carbon-aware-dispatcher@v1
        id: carbon
        with:
          # Candidate zones across regions with different price/carbon trade-offs
          grid_zones: 'CISO,GB,FR,AU-NSW'
          cost_weight: '0.5'   # balance cheap and clean

  deploy:
    needs: route
    runs-on: ubuntu-latest
    env:
      # Azure region is used here; swap for cloud_region (AWS) or gcp_region (GCP)
      # by adding those outputs to the route job above.
      AZURE_DEFAULTS_LOCATION: ${{ needs.route.outputs.region }}
    steps:
      - uses: actions/checkout@v5

      - name: Show selected region
        run: |
          echo "Zone:    ${{ needs.route.outputs.zone }}"
          echo "Region:  ${{ needs.route.outputs.region }}"
          echo "Carbon:  ${{ needs.route.outputs.intensity }} gCO2eq/kWh"
          echo "Price:   ${{ needs.route.outputs.price }} USD/hr"

      # AZURE_DEFAULTS_LOCATION is already set above, so az commands pick it up automatically
      - name: Deploy
        run: az webapp up --name my-app
        # AWS alternative:  aws s3 sync ./dist s3://my-bucket/
        #   (add cloud_region to route outputs, set AWS_DEFAULT_REGION instead)
        # GCP alternative:  gcloud run deploy my-service --image gcr.io/my-project/my-image
        #   (add gcp_region to route outputs, set CLOUDSDK_COMPUTE_REGION instead)
